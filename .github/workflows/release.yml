name: release

# Release flow (recipe: dsh-github-picker): a `chore(release)` commit bumps
# package.json; any push touching it re-runs the pipeline. Tests/build run
# locally before the bump (devDependencies are machine-local link: entries CI
# cannot install); the committed lib/ is what ships. An existing tag makes
# every step a no-op, so replayed or manual runs stay idempotent.
on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Resolve the version to release
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # Release notes from conventional commits since the last tag
      # (changelogithub's default types config excludes docs/ci/chore/test).
      # Runs BEFORE the tag exists so the from-range still ends at the last
      # release tag (or the full history for the first release).
      - name: Generate the release notes with changelogithub
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --yes changelogithub --output "$RUNNER_TEMP/release-notes.md"

      - name: Create the tag if missing
        id: tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag $TAG already exists; nothing to release"
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Annotated tags need a committer identity; the runner has none.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "new=true" >> "$GITHUB_OUTPUT"

      # `--generate-notes` appends GitHub's autogenerated changelog below the
      # changelogithub notes. Prerelease versions (`-` in the version) are
      # marked prerelease.
      - name: Create the GitHub release
        if: steps.tag.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            gh release create "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes --prerelease
          else
            gh release create "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes
          fi

      # Skipped with a notice until the NPM_TOKEN secret exists on the repo —
      # the plugin's update check reads GitHub releases, so npm is optional.
      - name: Publish to npm
        if: steps.tag.outputs.new == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret not set — skipping npm publish (GitHub release only)"
            exit 0
          fi
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "$VERSION" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi
